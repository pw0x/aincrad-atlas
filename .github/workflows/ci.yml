name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test feedback delivery and release activation
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y python3-pil
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the public distribution
        env:
          VITE_ATLAS_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Publish tested main build and check the running revision
        id: publish
        if: github.repository == 'pw0x/aincrad-atlas' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ATLAS_SSH_HOST != ''
        env:
          ATLAS_DEPLOY_KEY: ${{ secrets.ATLAS_DEPLOY_KEY }}
          ATLAS_SSH_HOST: ${{ vars.ATLAS_SSH_HOST }}
          ATLAS_SSH_KNOWN_HOSTS: ${{ vars.ATLAS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git ls-remote --exit-code https://github.com/pw0x/aincrad-atlas.git refs/heads/main | cut -f1)
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "A newer main revision is waiting. Skipping this superseded release."
            exit 0
          fi
          [[ "$ATLAS_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ -n "$ATLAS_DEPLOY_KEY" && -n "$ATLAS_SSH_KNOWN_HOSTS" ]]
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          umask 077
          printf '%s\n' "$ATLAS_DEPLOY_KEY" > "$tmp/deploy-key"
          printf '%s\n' "$ATLAS_SSH_KNOWN_HOSTS" > "$tmp/known_hosts"
          printf '%s\n' "$GITHUB_RUN_NUMBER" > "$tmp/deploy-run.txt"
          tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 -cf "$tmp/site.tar" \
            dist server/atlas.py server/dispatcher.py server/feedback.py -C "$tmp" deploy-run.txt
          digest=$(sha256sum "$tmp/site.tar" | cut -d' ' -f1)
          ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$tmp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i "$tmp/deploy-key" "atlas-deploy@$ATLAS_SSH_HOST" "publish $GITHUB_SHA $digest" < "$tmp/site.tar"
          echo "published=true" >> "$GITHUB_OUTPUT"

  record-publication:
    name: Verify public deployment
    needs: test-and-build
    if: needs.test-and-build.outputs.published == 'true' && github.repository == 'pw0x/aincrad-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      deployments: write
    environment:
      name: production
      url: https://aincrad.pw0studio.com
    steps:
      - name: Verify the revision served over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            live=$(curl -fsS --max-time 8 https://aincrad.pw0studio.com/api/version | jq -er '.version' || true)
            if [[ "$live" == "$GITHUB_SHA" ]]; then
              echo "Verified $GITHUB_SHA at https://aincrad.pw0studio.com" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
              main=$(git ls-remote --exit-code https://github.com/pw0x/aincrad-atlas.git refs/heads/main | cut -f1)
              if [[ "$live" == "$main" && "$main" != "$GITHUB_SHA" ]]; then
                echo "The receiver verified $GITHUB_SHA before the newer main build $live became public." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::The public site did not serve the deployed revision."
          exit 1
