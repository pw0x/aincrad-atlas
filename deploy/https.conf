map "$uri:$arg_receipt" $aincrad_legacy_task {
    default "";
    "~^/(?:index\.html|floor-01\.html|floor-22\.html)?:([0-9a-f]{32})$" /api/feedback/$1/task;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aincrad.pw0studio.com;
    ssl_certificate /etc/letsencrypt/live/aincrad.pw0studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aincrad.pw0studio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/aincrad-atlas/current/dist;
    access_log off;
    gzip_static on;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    if ($aincrad_legacy_task) { return 302 $aincrad_legacy_task; }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =503;
    }
    location = /portal.html { return 308 /$is_args$args; }
    location ~ "^/api/(?:version|feedback/[a-f0-9]{32}(?:/capture\.jpg|/task)?)$" {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8093;
    }
    location /api/ { return 404; }
    location /assets/ {
        expires 1h;
        try_files $uri @past_asset;
    }
    location @past_asset {
        root /srv/aincrad-atlas;
        expires 1h;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
