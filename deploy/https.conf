limit_req_zone $binary_remote_addr zone=aincrad_intake:1m rate=12r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aincrad.pw0studio.com;
    ssl_certificate /etc/letsencrypt/live/aincrad.pw0studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aincrad.pw0studio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/aincrad-atlas/current/dist;
    access_log off;
    gzip_static on;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = / {
        add_header Cache-Control "no-cache";
        try_files /portal.html =503;
    }
    location = /api/feedback {
        limit_req zone=aincrad_intake burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 1200k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8093;
    }
    location /api/ {
        client_max_body_size 1200k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8093;
    }
    location /assets/ {
        expires 1h;
        try_files $uri @past_asset;
    }
    location @past_asset {
        root /srv/aincrad-atlas;
        expires 1h;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
